# =============================================================================
# ZEROPS — konfigurace sestavení a spuštění (build & run pipeline)
# =============================================================================
#
# Co je Zerops: cloudová platforma, kam se dá tenhle projekt nasadit jedním
# příkazem. Tenhle soubor Zerops přesně říká: (1) jak z kódu udělat spustitelnou
# aplikaci ("build") a (2) jak ji pak provozovat ("run").
#
# `setup: nodejs` níže musí odpovídat NÁZVU (hostname) Node.js služby v tvém
# Zerops projektu — v projektu "web" (https://app.zerops.io) se služba
# jmenuje přesně takhle. Base `nodejs@24` odpovídá verzi, se kterou byla
# služba založená (alpine/nodejs@24).
#
# JAK NASADIT:
#   1. Nainstaluj zCLI: npm i -g @zerops/zcli
#   2. zcli login <token>   (token z Zerops GUI → Access Token Management)
#   3. V tomto adresáři spusť:
#        zcli push nodejs --setup nodejs -P oJ1DoA35QJqucQdBelpCWA
#      (Zerops zabalí projekt, pošle ho na server a spustí build+run podle
#       tohoto souboru — commit do gitu ani GitHub k tomu není potřeba.)
#
# Alternativa: připojit GitHub repozitář v Zerops GUI (Nastavení služby →
# Git Integration) — pak se nasadí automaticky při každém "git push".
#
# Předtím, než poprvé pushneš, musí mít služba "nodejs" v Zerops GUI
# (Environment Variables) nastavené: DATABASE_URI, PAYLOAD_SECRET,
# NEXT_PUBLIC_SERVER_URL — viz README.md, sekce Nasazení na Zerops.

zerops:
  - setup: nodejs
    build:
      # Verze Node.js — musí sedět s tím, s čím byla služba založená.
      base: nodejs@24

      buildCommands:
        # `--include=dev` je důležité: bez něj by se v produkčním prostředí
        # nenainstalovaly vývojové závislosti (typescript, tailwind, tsx…),
        # které `next build` a naše seed/migrační skripty potřebují.
        - npm ci --include=dev

        # Import mapa administrace — po přidání/změně Lexical funkcí nebo
        # kolekcí je potřeba ji přegenerovat, jinak admin rozhraní spadne
        # (na tenhle problém jsme narazili i lokálně, viz README).
        - npm run generate:importmap

        # Produkční build Next.js (admin i veřejný web dohromady).
        - npm run build

      # Které soubory se z build kroku přenesou do běžícího kontejneru.
      # (Projekt nemá složku `public` — pokud ji někdy přidáš, např. kvůli
      # faviconě, dopiš ji sem.)
      deployFiles:
        - .next
        - src
        - node_modules
        - package.json
        - next.config.ts
        - postcss.config.mjs

      # Mezi jednotlivými nasazeními se tohle nemaže — zrychlí to další build.
      # (`.next/cache` se záměrně necachuje — retrieved soubory kolidovaly
      # s oprávněními nového buildu a next build padal na
      # "EACCES: permission denied, open '.next/trace'".)
      cache:
        - node_modules

    run:
      base: nodejs@24

      ports:
        - port: 3000
          # Zpřístupní port 3000 na veřejné (HTTPS) adrese vygenerované Zerops,
          # případně na tvé vlastní doméně po jejím napojení.
          httpSupport: true

      envVariables:
        # KRITICKÉ pro Payload: teprve s NODE_ENV=production se vypne
        # automatický "push" schématu databáze a použijí se místo něj
        # bezpečné migrace ze složky src/migrations (viz payload.config.ts).
        NODE_ENV: production

      # Soubory (obrázky, dokumenty) se od zapojení S3 Object Storage
      # ukládají trvale mimo kontejner — seed při každém startu už
      # není potřeba, žádný redeploy je nesmaže.
      start: npm start
