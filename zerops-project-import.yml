# =============================================================================
# ZEROPS — založení projektu a služeb (referenční soubor)
# =============================================================================
#
# ⚠️ Tenhle soubor už NEPOUŽÍVÁŠ ke spuštění — projekt "web" (ID
# oJ1DoA35QJqucQdBelpCWA) se službami "nodejs" a "postgresql" už na Zerops
# existuje (založil se přes GUI). Soubor tu zůstává jako referenční popis
# infrastruktury pro případ, že bys ji někdy potřeboval založit znovu
# (např. nový projekt, jiný účet) — pak spustíš:
#
#   zcli project import zerops-project-import.yml
#
# Nasazovací pipeline (co se děje PŘI KAŽDÉM nasazení) je v `zerops.yml`.
#
# ⚠️ Schéma importního YAML se u Zerops občas mění — než soubor použiješ,
# porovnej ho s aktuální dokumentací (docs.zerops.io → Import).

project:
  name: web

services:
  # ---------------------------------------------------------------------------
  # Databáze — PostgreSQL. Hostname "postgresql" používá "nodejs" k připojení
  # (viz DATABASE_URI níže).
  # ---------------------------------------------------------------------------
  - hostname: postgresql
    type: postgresql@16
    mode: NON_HA # jedna instance bez zálohy navíc — v pořádku pro malý web školky
    priority: 10 # vyšší priorita = vytvoří se dřív než "nodejs", které ji potřebuje

  # ---------------------------------------------------------------------------
  # Aplikace — Next.js + Payload (build/run kroky viz zerops.yml v tomto repu).
  # ---------------------------------------------------------------------------
  - hostname: nodejs
    type: nodejs@24
    priority: 1
    # Veřejná adresa tvaru https://nodejs-XXXX-3000.prg1.zerops.app — hned po
    # založení uvidíš web na internetu, i než si připojíš vlastní doménu.
    enableSubdomainAccess: true
    ports:
      - port: 3000
        httpSupport: true
    envVariables:
      # ${postgresql_connectionString} neobsahuje název databáze, proto
      # dolepujeme ${postgresql_dbName} — takhle to Zerops propojuje mezi
      # službami automaticky (žádné heslo se nikam ručně neopisuje).
      DATABASE_URI: ${postgresql_connectionString}/${postgresql_dbName}

      # ⚠️ DOPLŇ po prvním nasazení / povolení subdomény skutečnou adresu
      # (nebo vlastní doménu) — používá se pro SEO (sitemap, Open Graph),
      # CORS a CSRF. Next.js proměnné NEXT_PUBLIC_* se zapékají už při
      # buildu, proto musí být nastavené PŘED prvním pushem.
      NEXT_PUBLIC_SERVER_URL: https://zmen-na-skutecnou-adresu.cz

      # ⚠️ NEPOVINNÉ, ale doporučené: S3 úložiště pro nahrané soubory
      # (obrázky, dokumenty), aby při každém nasazení nezmizely — kontejner
      # aplikace je totiž při každém redeploy nový a jeho disk se nezachovává.
      #
      # 1. V Zerops GUI přidej do projektu službu "Object Storage".
      # 2. Zkopíruj z ní přístupové údaje a vlož je sem (přesné názvy
      #    proměnných se mohou lišit, na obrazovce služby je uvidíš):
      # S3_BUCKET: nazev-bucketu
      # S3_ACCESS_KEY_ID: ...
      # S3_SECRET_ACCESS_KEY: ...
      # S3_ENDPOINT: https://...
      # S3_REGION: us-east-1
      #
      # Bez těchto proměnných web funguje normálně, jen si soubory ukládá
      # na disk kontejneru — což znamená, že o ně přijdeš při dalším nasazení
      # nové verze. Detaily viz komentář u `pouzitS3Uloziste`
      # v src/payload.config.ts.

    envSecrets:
      # ⚠️ PAYLOAD_SECRET sem NEVYPLŇUJ přímo — tajný klíč pro podepisování
      # přihlašovacích tokenů nastav ručně v Zerops GUI (služba "nodejs" →
      # Environment Variables → Add secret), ať nekončí v žádném souboru.
      # Vygeneruješ ho stejně jako lokální PAYLOAD_SECRET v .env, např.:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      PAYLOAD_SECRET: ~
